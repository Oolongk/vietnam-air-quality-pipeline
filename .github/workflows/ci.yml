name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  TZ: Asia/Ho_Chi_Minh

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run Ruff lint checks
        run: >-
          python -m ruff check
          api dags scripts src tests
          --output-format=github

      - name: Run Ruff format checks
        run: >-
          python -m ruff format
          --check
          --output-format=github
          api dags scripts src tests

      - name: Verify data contract catalog
        run: python -m scripts.export_data_contracts --check

      - name: Verify runtime inventory
        run: python -m scripts.check_runtime_inventory

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit and integration tests with coverage
        run: >-
          python -m pytest tests
          -v
          --cov=src
          --cov=api
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-python-3.11
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
